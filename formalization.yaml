fidelity:
  divergences: None known. Each Challenge statement is written with Mathlib's notions only. The four
    exp lᵢⱼ are algebraic over ℚ and the lᵢⱼ are non-zero. l₁₁ * l₂₂ = l₁₂ * l₂₁ says the matrix has
    rank one; Algebra.trdeg ℚ ↥(Algebra.adjoin ℚ {l₁₁, l₁₂, l₂₁, l₂₂}) ≤ 1 is the transcendence-degree
    hypothesis. The conclusion gives rationals a, b, not both zero, annihilating the two columns,
    or the two rows. Complex.exp (Complex.exp 1) is e^e and Complex.exp (Complex.exp 1 ^ 2) is e^{e²};
    Transcendental ℚ is Mathlib's "not algebraic over ℚ". The hypotheses fix one column of the matrix
    (exp (xᵢ yⱼ)) as algebraic. The conclusion picks a, b from the eight-element set and asserts AlgebraicIndependent
    ℚ ![a, b]; in particular a ≠ b. The compared theorems live in the namespace FourExponentials and
    the library theorems keep their library names; the statements are the same up to unfolding the
    library's abbreviations.
review:
