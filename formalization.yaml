# formalization.yaml v0.4
version: v0.4
project:
  name: The four exponentials theorem in transcendence degree one, and Schneider's eighth problem
  description: 'The four exponentials theorem in transcendence degree one (Waldschmidt 1973; Brownawell
    1974). Let lᵢⱼ be four non-zero logarithms of algebraic numbers with l₁₁ l₂₂ = l₁₂ l₂₁. If the
    field they generate has transcendence degree at most one over ℚ, then the rows or the columns
    of the matrix (lᵢⱼ) are linearly dependent over ℚ. Schneider''s eighth problem (Waldschmidt 1973;
    Brownawell 1974): one of e^e and e^{e²} is transcendental. If x₁, x₂ and y₁, y₂ are each linearly
    independent over ℚ and exp (x₁ y₂), exp (x₂ y₂) are algebraic, then two of the eight numbers xᵢ,
    yⱼ, exp (xᵢ yⱼ) are algebraically independent over ℚ (Waldschmidt 1973; Brownawell 1974). This
    repository is a self-contained extract of these theorems from the library github.com/carlok/diaz-modulus-lean,
    which is the canonical home of the proofs.'
  authors:
  - Carlo Perassi
  license: Apache-2.0
  responsible_maintainers:
  - Carlo Perassi
